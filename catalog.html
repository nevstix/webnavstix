<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Clothing & Tshirt</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }
    .produk-list {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .produk-item {
      background-color: #111;
      padding: 15px;
      width: 200px;
      border-radius: 10px;
      text-align: center;
    }
    .produk-item img {
      width: 100%;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Clothing & Apparel</h1>
  <div class="produk-list">
    <div class="produk-item">
      <img src="cg1.jpg" alt="Tshirt">
      <p>Volume 1 </p>
      <p>Price: Rp.212,000</p>
    </div>
    <div class="produk-item">
      <img src="cg2.jpg" alt="Clothing">
      <p>For Eyes For One</p>
         <p>Price: Rp. 666,000</p>
    </div>
    <!-- Tambahkan item lainnya -->
  </div>
</body>
</html>
